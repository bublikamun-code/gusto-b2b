name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --redact --verbose --no-banner

  backend:
    runs-on: ubuntu-latest
    env:
      # CI-значения: не секреты, только чтобы контекст Spring резолвил обязательные placeholder'ы.
      # ADMIN_PASSWORD=change-me осознанно: AuthIntegrationTest/FlywayBaselineSchemaTest завязаны на этот пароль.
      JWT_SECRET: ci-jwt-secret-not-a-real-secret-64-chars-0000000000000000 # gitleaks:allow
      ADMIN_PASSWORD: change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify -f backend/pom.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend
      - name: Generate API types
        run: npm run generate-api --prefix frontend   # заодно валидирует shared/openapi.yaml
      - name: Audit prod dependencies (S40)
        run: npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Test
        run: npm run test --prefix frontend
      - name: Build
        run: npm run build --prefix frontend

  # S40: сканирование зависимостей backend. Информационная (continue-on-error):
  # гейт CVSS сейчас красный (см. docs/security-checklist.md, S41), а без
  # NVD_API_KEY база NVD тянется анонимно и занимает ~30 минут. Когда появятся
  # секрет NVD_API_KEY и зелёный скан — убрать continue-on-error.
  dependency-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache OWASP dependency-check data
        uses: actions/cache@v4
        with:
          # БД NVD (~400k записей) лежит в локальном репозитории Maven —
          # без кеша каждый прогон тянет её заново.
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}
      - name: Outdated dependencies report
        run: mvn -B versions:display-dependency-updates -f backend/pom.xml -DprocessDependencyManagement=false || true
      - name: OWASP dependency-check
        env:
          # 13+ отправляет заголовок apiKey всегда: NVD отвечает 404 на пустой
          # ключ (и на невалидный тоже), но 200 без заголовка. Поэтому флаг
          # добавляется только когда секрет непустой.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(-DfailBuildOnCVSS=9 -Dformat=HTML)
          if [ -n "${NVD_API_KEY}" ]; then
            ARGS+=("-DnvdApiKey=${NVD_API_KEY}")
          else
            echo "::warning::NVD_API_KEY не задан — сканирование без ключа, база NVD обновится анонимно (долго при первом прогоне)"
          fi
          mvn -B org.owasp:dependency-check-maven:12.1.8:check -f backend/pom.xml "${ARGS[@]}"
