spring:
  application:
    name: gusto-b2b-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gusto}
    username: ${SPRING_DATASOURCE_USERNAME:gusto}
    password: ${SPRING_DATASOURCE_PASSWORD:gusto}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Плейсхолдеры для сид-миграции V2 (пароль админа живёт только в .env)
    placeholders:
      admin_email: ${ADMIN_EMAIL:admin@gustomeat.by}
      admin_password: ${ADMIN_PASSWORD:change-me}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
