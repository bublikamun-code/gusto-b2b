spring:
  application:
    name: gusto-b2b-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gusto}
    username: ${SPRING_DATASOURCE_USERNAME:gusto}
    password: ${SPRING_DATASOURCE_PASSWORD:gusto}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    # Плейсхолдеры для сид-миграции V2 (пароль админа живёт только в .env)
    placeholders:
      admin_email: ${ADMIN_EMAIL:admin@gustomeat.by}
      admin_password: ${ADMIN_PASSWORD:change-me}

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: Strict

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-replace-with-64-random-characters-before-production}
    issuer: gusto-b2b
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  security:
    refresh-cookie-name: refresh_token
    rate-limit:
      attempts: 5
      window-minutes: 15
  storage:
    path: ${APP_STORAGE_PATH:./data/files}
    max-file-size: ${APP_STORAGE_MAX_FILE_SIZE:10485760}
    allowed-mime-types: ${APP_STORAGE_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp}
