# Nginx витрины и API (S41): статика Vite + обратный прокси на backend.
# Секция http подгружается из /etc/nginx/nginx.conf (nginx:alpine по умолчанию).

server {
    listen 80;
    server_name gustomeat.by www.gustomeat.by;

    # ACME-челлендж Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Остальной HTTP — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gustomeat.by www.gustomeat.by;

    ssl_certificate     /etc/letsencrypt/live/gustomeat.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gustomeat.by/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # S40/S41: security-заголовки витрины
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Без inline-скриптов: Vite-бандл — внешние файлы
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.telegram.org https://*.crisp.chat wss://*.crisp.chat; frame-src 'self' https://*.crisp.chat" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Загрузка .xlsx в мастер 1С
    client_max_body_size 12m;

    # API → backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health-check для мониторинга
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    # Витрина (SPA-роутинг)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
