openapi: 3.1.0
info:
  title: GUSTO B2B API
  version: 0.2.0
  description: |
    Контракт API B2B-портала «Густо». Заполняется по мере сессий (чек-лист, Часть 4):
    каждая сессия, меняющая эндпоинт, обновляет этот файл в том же PR.

    **Envelope.** Все ответы: `{data, meta, error}`. Успех — `data` заполнен, `error: null`.
    Ошибка — `data: null`, `error: {code, message, details?}`.

    **Каталог кодов ошибок** (`error.code`) фиксируется в `ErrorCode` и дальше только
    расширяется — существующие коды не переименовываются и не меняют смысл.

    **Пагинация** списков: query `page` (0-based, как в Spring Data), `size`;
    ответ — `meta: {page, size, total}` (total — всего элементов).

    **Аутентификация.** Access-токен (JWT, 15 мин) — заголовок `Authorization: Bearer`.
    Refresh-токен (7 дней, rotation + reuse detection) — httpOnly-кука
    `refresh_token` (Secure, SameSite=Strict), выдаётся при login/refresh,
    используется только эндпоинтом `/auth/refresh` и инвалидируется `/auth/logout`.

    **Идемпотентность.** Мутирующие `POST` (заказы, заявки) принимают заголовок
    `Idempotency-Key` (см. `components.parameters.IdempotencyKey`): повтор с тем же
    ключом в течение 24 ч возвращает тот же результат.

    **Health-эндпоинты** `/healthz`, `/readyz` живут вне префикса `/api/v1`
    (per-path `servers`).
servers:
  - url: /api/v1
tags:
  - name: health
  - name: auth
  - name: admin
  - name: users
  - name: companies
  - name: catalog
  - name: files
  - name: manager
  - name: cabinet

paths:
  /healthz:
    servers:
      - url: /
    get:
      tags: [health]
      summary: Liveness-проба
      responses:
        "200":
          description: Сервис жив
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: UP }
                          service: { type: string }
  /readyz:
    servers:
      - url: /
    get:
      tags: [health]
      summary: Readiness-проба
      responses:
        "200":
          description: Сервис готов принимать трафик
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: READY }

  /auth/login:
    post:
      tags: [auth]
      summary: Вход (email + пароль, при включённой 2FA — ещё и totpCode)
      description: |
        При включённой 2FA без `totpCode` возвращает 401 `AUTH_2FA_REQUIRED` —
        клиент показывает ввод кода и повторяет login с `totpCode`.
        Rate limit: 5 попыток / 15 мин на IP+email → 429 `RATE_LIMITED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Успешный вход; refresh-токен выставлен в httpOnly-куку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/register:
    post:
      tags: [auth]
      summary: Саморегистрация физлица (роль CUSTOMER_INDIVIDUAL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновление access-токена по refresh-куке (rotation)
      description: |
        Повтор уже использованного refresh-токена (reuse detection) ревокает всю
        цепочку токенов пользователя → 401 `AUTH_REFRESH_REUSED`.
      requestBody: { required: false }
      responses:
        "200":
          description: Новая пара токенов; refresh — в httpOnly-куке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Выход (ревокация refresh-токена, кука очищается)
      requestBody: { required: false }
      responses:
        "200":
          description: Refresh-токен ревокнут
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/2fa/enable:
    post:
      tags: [auth]
      summary: Начать включение 2FA (TOTP) — выдаёт секрет
      security:
        - bearerAuth: []
      requestBody: { required: false }
      responses:
        "200":
          description: Секрет для TOTP-приложения; 2FA активируется после /auth/2fa/verify
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetupResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/2fa/verify:
    post:
      tags: [auth]
      summary: Подтвердить включение 2FA кодом из приложения
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpVerifyRequest" }
      responses:
        "200":
          description: 2FA включена; recovery-коды показываются один раз
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpRecoveryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/password-reset/request:
    post:
      tags: [auth]
      summary: Запрос на восстановление пароля (одноразовый токен на 30 мин)
      description: Всегда 200, даже если email не существует — не раскрываем базу.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: Если email существует — письмо отправлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Установка нового пароля по токену из письма
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "200":
          description: Пароль изменён; все refresh-токены ревокнуты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/users:
    get:
      tags: [admin]
      summary: Список пользователей (только ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: companyId
          in: query
          schema: { type: string, format: uuid }
        - name: managerId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
          description: Поиск по email, ФИО, телефону
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Список пользователей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Создание пользователя ADMIN/ACCOUNTANT/MANAGER/CUSTOMER_LEGAL
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Пользователь создан; пароль выдаётся админу отдельно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID пользователя
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Карточка пользователя
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Данные пользователя
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      summary: Редактирование пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Пользователь обновлён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
      summary: Мягкое удаление пользователя
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Пользователь удалён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/reset-password:
    parameters:
      - name: id
        in: path
        required: true
        description: ID пользователя
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Сброс пароля админом (временный пароль, показывается 1 раз)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Временный пароль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPasswordResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/companies:
    get:
      tags: [admin]
      summary: Список компаний
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CompanyStatus" }
        - name: managerId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
          description: Поиск по названию, сокращённому названию, УНП
      responses:
        "200":
          description: Список компаний
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Создание компании
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCompanyRequest" }
      responses:
        "201":
          description: Компания создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/companies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID компании
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Карточка компании
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Данные компании
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      summary: Редактирование компании
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCompanyRequest" }
      responses:
        "200":
          description: Компания обновлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
      summary: Деактивация компании (status = INACTIVE)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Компания деактивирована
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /manager/companies:
    get:
      tags: [manager]
      summary: Список назначенных компаний (только MANAGER)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Компании, закреплённые за менеджером
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /manager/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [manager]
      summary: Карточка компании (MANAGER + ownership)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Данные компании
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [manager]
      summary: Редактирование назначенной компании (MANAGER + ownership)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCompanyRequest" }
      responses:
        "200":
          description: Компания обновлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/catalog/categories:
    get:
      tags: [admin]
      summary: Список всех категорий
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список категорий
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Создание категории
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryRequest" }
      responses:
        "201":
          description: Категория создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/categories/tree:
    get:
      tags: [admin]
      summary: Дерево активных категорий
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Дерево категорий
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryTreeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/catalog/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID категории
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Карточка категории
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Данные категории
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      summary: Редактирование категории
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryRequest" }
      responses:
        "200":
          description: Категория обновлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
      summary: Удаление категории (только если нет дочерних)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Категория удалена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/brands:
    get:
      tags: [admin]
      summary: Список брендов
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список брендов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Создание бренда
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandRequest" }
      responses:
        "201":
          description: Бренд создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/brands/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID бренда
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Карточка бренда
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Данные бренда
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      summary: Редактирование бренда
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandRequest" }
      responses:
        "200":
          description: Бренд обновлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
