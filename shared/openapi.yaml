          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен из /auth/login или /auth/refresh (15 мин)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ идемпотентности (UUID), повтор с тем же ключом 24 ч → тот же результат
      schema: { type: string, format: uuid }
    CompanyId:
      name: id
      in: path
      required: true
      description: ID компании
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      description: Номер страницы, 0-based
    SizeParam:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: Не аутентифицирован / неверные креды / истёкший токен
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            invalidCredentials:
              value: { data: null, meta: { }, error: { code: AUTH_INVALID_CREDENTIALS, message: "Неверный email или пароль" } }
    ValidationFailed:
      description: Ошибка валидации полей запроса
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            invalidFields:
              value: { data: null, meta: { }, error: { code: VALIDATION_FAILED, message: "Ошибка валидации", details: { "email": "некорректный email" } } }
    Forbidden:
      description: Доступ запрещён (недостаточно прав или чужой ресурс)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            forbidden:
              value: { data: null, meta: { }, error: { code: ACCESS_DENIED, message: "Доступ запрещён" } }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            notFound:
              value: { data: null, meta: { }, error: { code: NOT_FOUND, message: "Не найдено" } }
    Conflict:
      description: Конфликт уникальности (email/УНП уже заняты)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            duplicate:
              value: { data: null, meta: { }, error: { code: CONFLICT, message: "Пользователь с таким email уже существует" } }
    RateLimited:
      description: Превышен лимит запросов (5 попыток / 15 мин на IP+email для auth)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            limited:
              value: { data: null, meta: { }, error: { code: RATE_LIMITED, message: "Слишком много попыток, повторите позже" } }

  schemas:
    # ----- Envelope и пагинация -------------------------------------------------
    Envelope:
      type: object
      required: [data, meta, error]
      properties:
        data:
          nullable: true
          description: Полезная нагрузка; null при ошибке
        meta:
          $ref: "#/components/schemas/Meta"
        error:
          nullable: true
          $ref: "#/components/schemas/Error"
    Meta:
      type: object
      description: Для списков — пагинация; иначе пустой объект
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0, description: "Всего элементов" }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Человекочитаемое сообщение (ru)
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: "Опционально: поля формы → текст ошибки, и т.п."
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { nullable: true, enum: [null] }
            error:
              $ref: "#/components/schemas/Error"

    # Каталог кодов ошибок error.code. Только расширяется; не переименовывается.
    ErrorCode:
      type: string
      enum:
        # auth
        - AUTH_INVALID_CREDENTIALS # неверный email/пароль
        - AUTH_UNAUTHORIZED        # запрос без/с недействительным access-токеном
        - AUTH_2FA_REQUIRED        # login без totpCode при включённой 2FA
        - AUTH_2FA_INVALID         # неверный код TOTP
        - AUTH_TOKEN_EXPIRED       # access-токен истёк
        - AUTH_TOKEN_INVALID       # подпись/формат токена не валидны
        - AUTH_REFRESH_INVALID     # refresh-токен недействителен/отсутствует
        - AUTH_REFRESH_REUSED      # повтор использованного refresh → ревок цепочки
        - AUTH_RESET_TOKEN_INVALID # токен восстановления просрочен/неверен
        # доступ
        - ACCESS_DENIED            # 403 по роли/ownership
        - NOT_FOUND                # 404 сущность не найдена
        - CONFLICT                 # 409 конфликт уникальности
        - RATE_LIMITED             # 429 превышен лимит
        - IDEMPOTENCY_CONFLICT     # тот же ключ, другое тело запроса
        # валидация
        - VALIDATION_FAILED        # ошибки полей запроса
        # склад
        - STOCK_INSUFFICIENT       # недостаточно остатка для заказа/резерва
        - STOCK_DOCUMENT_INVALID   # неверный переход статуса складского документа
        # общие
        - INTERNAL                 # непредвиденная ошибка сервера

    # ----- Auth ------------------------------------------------------------------
    Role:
      type: string
      enum: [ADMIN, ACCOUNTANT, MANAGER, CUSTOMER_LEGAL, CUSTOMER_INDIVIDUAL]
    User:
      type: object
      required: [id, email, fullName, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        companyId: { type: string, format: uuid, nullable: true, description: "Заполнен у CUSTOMER_LEGAL" }
        isActive: { type: boolean }
        totpEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        totpCode: { type: string, pattern: "^\\d{6}$", description: "Обязателен, если у пользователя включена 2FA" }
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        password: { type: string, format: password, minLength: 8 }
        fullName: { type: string }
    AccessToken:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, description: "JWT, 15 мин" }
        tokenType: { type: string, example: "Bearer" }
        expiresIn: { type: integer, description: "Секунд до истечения access-токена", example: 900 }
    UserResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/User" }
    UserListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/User" }
    CompanyStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    Company:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shortName: { type: string, nullable: true }
        unp: { type: string, nullable: true, pattern: "^\\d{9}|\\d{10}$", description: "УНП РБ: 9 или 10 цифр" }
        legalAddress: { type: string, nullable: true }
        actualAddress: { type: string, nullable: true }
        bankAccount: { type: string, nullable: true }
        bankName: { type: string, nullable: true }
        bankBic: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        contactEmail: { type: string, format: email, nullable: true }
        status: { $ref: "#/components/schemas/CompanyStatus" }
        managerId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/Company" }
    CompanyListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Company" }
    TokenResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/AccessToken" }
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AccessToken"
                - properties:
                    user: { $ref: "#/components/schemas/User" }
    TotpSetupResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: object
              required: [secret, otpauthUrl]
              properties:
                secret: { type: string, description: "Base32-секрет для ручного ввода" }
                otpauthUrl: { type: string, description: "otpauth:// для QR-кода" }
    TotpVerifyRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^\\d{6}$" }
    TotpRecoveryResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: object
              required: [recoveryCodes]
              properties:
                recoveryCodes:
                  type: array
                  items: { type: string }
                  description: Показываются один раз

    # ----- Admin / Companies CRUD -----------------------------------------------
    CreateUserRequest:
      type: object
      required: [email, fullName, role]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, minLength: 2, maxLength: 255 }
        phone: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        companyId: { type: string, format: uuid, nullable: true, description: "Обязательна для CUSTOMER_LEGAL" }
    UpdateUserRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 255 }
        phone: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        companyId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
    TemporaryPasswordResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: object
              required: [userId, temporaryPassword]
              properties:
                userId: { type: string, format: uuid }
                temporaryPassword: { type: string, description: "Показывается один раз" }
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        shortName: { type: string, maxLength: 255, nullable: true }
        unp: { type: string, pattern: "^\\d{9}|\\d{10}$", nullable: true, description: "УНП РБ: 9 или 10 цифр" }
        legalAddress: { type: string, maxLength: 500, nullable: true }
        actualAddress: { type: string, maxLength: 500, nullable: true }
        bankAccount: { type: string, maxLength: 50, nullable: true }
        bankName: { type: string, maxLength: 255, nullable: true }
        bankBic: { type: string, maxLength: 20, nullable: true }
        contactPhone: { type: string, maxLength: 50, nullable: true }
        contactEmail: { type: string, format: email, maxLength: 255, nullable: true }
        managerId: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/CompanyStatus" }
    UpdateCompanyRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        shortName: { type: string, maxLength: 255, nullable: true }
        unp: { type: string, pattern: "^\\d{9}|\\d{10}$", nullable: true }
        legalAddress: { type: string, maxLength: 500, nullable: true }
        actualAddress: { type: string, maxLength: 500, nullable: true }
        bankAccount: { type: string, maxLength: 50, nullable: true }
        bankName: { type: string, maxLength: 255, nullable: true }
        bankBic: { type: string, maxLength: 20, nullable: true }
        contactPhone: { type: string, maxLength: 50, nullable: true }
        contactEmail: { type: string, format: email, maxLength: 255, nullable: true }
        managerId: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/CompanyStatus" }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirm:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 8 }

    # ----- Catalog --------------------------------------------------------------
    Category:
      type: object
      required: [id, name, slug, sort, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255, pattern: "^[a-z0-9-]+$" }
        parentId: { type: string, format: uuid, nullable: true }
        sort: { type: integer }
        isActive: { type: boolean }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    CategoryRequest:
      type: object
      required: [name, slug, sort, active]
      properties:
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255, pattern: "^[a-z0-9-]+$" }
        parentId: { type: string, format: uuid, nullable: true }
        sort: { type: integer, default: 0 }
        active: { type: boolean, default: true }
    CategoryResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/Category" }
    CategoryListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Category" }
    CategoryTreeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Category" }

    Brand:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255, pattern: "^[a-z0-9-]+$" }
    BrandRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255, pattern: "^[a-z0-9-]+$" }
    BrandResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/Brand" }
    BrandListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Brand" }

    Product:
      type: object
      required: [id, sku, name, categoryId, unit, vatRate, minStock, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 500 }
        categoryId: { type: string, format: uuid }
        brandId: { type: string, format: uuid, nullable: true }
        description: { type: string, nullable: true, maxLength: 4000 }
        unit: { type: string, maxLength: 20, default: "кг" }
        manufacturer: { type: string, nullable: true, maxLength: 255 }
        country: { type: string, nullable: true, maxLength: 100, default: "РБ" }
        tnvedCode: { type: string, nullable: true, maxLength: 20 }
        barcode: { type: string, nullable: true, maxLength: 50 }
        vatRate: { type: number, default: 10 }
        weightPerUnit: { type: number, nullable: true }
        minStock: { type: number, default: 0 }
        isActive: { type: boolean, default: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        imageUrl: { type: string, nullable: true, description: "URL главного фото товара" }
        imageUrls:
          type: array
          items: { type: string }
    ProductRequest:
      type: object
      required: [sku, name, categoryId, unit, vatRate, minStock, active]
      properties:
        sku: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 500 }
        categoryId: { type: string, format: uuid }
        brandId: { type: string, format: uuid, nullable: true }
        description: { type: string, nullable: true, maxLength: 4000 }
        unit: { type: string, maxLength: 20, default: "кг" }
        manufacturer: { type: string, nullable: true, maxLength: 255 }
        country: { type: string, nullable: true, maxLength: 100, default: "РБ" }
        tnvedCode: { type: string, nullable: true, maxLength: 20 }
        barcode: { type: string, nullable: true, maxLength: 50 }
        vatRate: { type: number, default: 10 }
        weightPerUnit: { type: number, nullable: true }
        minStock: { type: number, default: 0 }
        active: { type: boolean, default: true }
    ProductResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/Product" }
    ProductListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Product" }

    CatalogProduct:
      type: object
      required: [id, sku, name, unit, retailPrice]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        brand: { $ref: "#/components/schemas/Brand", nullable: true }
        unit: { type: string }
        description: { type: string, nullable: true }
        retailPrice: { type: number }
        imageUrl: { type: string, nullable: true, description: "URL главного фото товара" }
        imageUrls:
          type: array
          items: { type: string }
    CatalogProductResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/CatalogProduct" }
    CatalogProductListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CatalogProduct" }

    # ----- Pricing --------------------------------------------------------------
    PriceList:
      type: object
      required: [id, name, validFrom, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
        isActive: { type: boolean, default: true }
    PriceListRequest:
      type: object
      required: [name, validFrom]
      properties:
        name: { type: string, maxLength: 255 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
        isActive: { type: boolean, default: true }
    PriceListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/PriceList" }
    PriceListListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/PriceList" }

    ProductPrice:
      type: object
      required: [id, priceListId, productId, price, validFrom]
      properties:
        id: { type: string, format: uuid }
        priceListId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        price: { type: number }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
    ProductPriceRequest:
      type: object
      required: [priceListId, productId, price, validFrom]
      properties:
        priceListId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        price: { type: number, minimum: 0.01 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
    ProductPriceResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/ProductPrice" }
    ProductPriceListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ProductPrice" }

    CustomerPrice:
      type: object
      required: [id, companyId, productId, price, validFrom]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        price: { type: number }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
    CustomerPriceRequest:
      type: object
      required: [companyId, productId, price, validFrom]
      properties:
        companyId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        price: { type: number, minimum: 0.01 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
    CustomerPriceResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/CustomerPrice" }
    CustomerPriceListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CustomerPrice" }

    CustomerDiscount:
      type: object
      required: [id, companyId, discountPercent, validFrom]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        brandId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        discountPercent: { type: number, minimum: 0, maximum: 100 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
    CustomerDiscountRequest:
      type: object
      required: [companyId, discountPercent, validFrom]
      properties:
        companyId: { type: string, format: uuid }
        brandId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        discountPercent: { type: number, minimum: 0, maximum: 100 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
    CustomerDiscountResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/CustomerDiscount" }
    CustomerDiscountListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CustomerDiscount" }

    CabinetProduct:
      type: object
      required: [id, sku, name, unit, retailPrice, customerPrice]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        brand: { $ref: "#/components/schemas/Brand", nullable: true }
        unit: { type: string }
        description: { type: string, nullable: true }
        retailPrice: { type: number }
        customerPrice: { type: number }
        imageUrl: { type: string, nullable: true, description: "URL главного фото товара" }
        imageUrls:
          type: array
          items: { type: string }
    CabinetProductResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/CabinetProduct" }
    CabinetProductListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CabinetProduct" }

    # ----- Files ---------------------------------------------------------------
    File:
      type: object
      required: [id, storageKey, originalName, mimeType, sizeBytes, visibility, url, createdAt]
      properties:
        id: { type: string, format: uuid }
        storageKey: { type: string }
        originalName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        url: { type: string }
        createdAt: { type: string, format: date-time }
    FileResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/File" }
    ProductImage:
      type: object
      required: [id, fileId, url, sort]
      properties:
        id: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        url: { type: string }
        sort: { type: integer }
    ProductImageResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data: { $ref: "#/components/schemas/ProductImage" }
    ProductImageListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ProductImage" }
