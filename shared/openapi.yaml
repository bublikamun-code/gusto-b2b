        contactPhone: { type: string, maxLength: 50, nullable: true }
        contactEmail: { type: string, format: email, maxLength: 255, nullable: true }
        managerId: { type: string, format: uuid, nullable: true }
    UpdateCompanyRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        shortName: { type: string, maxLength: 255, nullable: true }
        unp: { type: string, pattern: "^\\d{9}|\\d{10}$", nullable: true }
        legalAddress: { type: string, maxLength: 500, nullable: true }
        actualAddress: { type: string, maxLength: 500, nullable: true }
        bankAccount: { type: string, maxLength: 50, nullable: true }
        bankName: { type: string, maxLength: 255, nullable: true }
        bankBic: { type: string, maxLength: 20, nullable: true }
        contactPhone: { type: string, maxLength: 50, nullable: true }
        contactEmail: { type: string, format: email, maxLength: 255, nullable: true }
        managerId: { type: string, format: uuid, nullable: true }
        status: { type: string, maxLength: 20, nullable: true }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirm:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 8 }
