services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gusto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gusto}
      POSTGRES_DB: ${POSTGRES_DB:-gusto}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gusto} -d ${POSTGRES_DB:-gusto}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gusto}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gusto}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gusto}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gustomeat.by}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      APP_STORAGE_PATH: /app/data/files
    volumes:
      - filedata:/app/data/files
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8080
    volumes:
      - ./frontend:/app          # hot reload: правки на хосте видны в контейнере
      - /app/node_modules        # не затираем зависимости образа
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  filedata:
